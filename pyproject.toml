[project]
name = "swlamp-mcp"
version = "0.1.0"
description = "MCP server that lets Claude design flat-pack sheet-metal decor lamps in SolidWorks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=2.3,<3",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "shapely>=2.0,<3",
    "ezdxf>=1.3,<2",
    "fonttools>=4.50,<5",
    "svgelements>=1.9,<2",
    "pillow>=10",
]

[project.scripts]
swlamp-mcp = "swlamp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swlamp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sw: needs a running, licensed SolidWorks 2025"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
